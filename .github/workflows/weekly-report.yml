name: Weekly feed-health report

# Every Sunday at 04:00 UTC: re-probe all streams and post a GitHub issue
# summarizing channels that need attention (pruning candidates, dead streams,
# primaries down). One labeled issue is kept open at a time. Run it anytime
# from the Actions tab.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout feeds repo
        uses: actions/checkout@v5

      - name: Fetch + probe streams
        working-directory: tools
        run: python3 fetch_feeds.py

      - name: Generate report
        run: |
          python3 tools/feed_report.py channels.json > report.md
          echo "report bytes: $(wc -c < report.md)"
          ls -la channels.json tools/feed_report.py

      - name: Ensure label exists
        run: gh label create feed-health --description "Weekly feed health report" --color "fbca04" --force || true

      - name: Close previous report issue
        run: |
          gh issue list --label feed-health --state open --json number --jq '.[].number' \
            | xargs -r -n1 gh issue close --reason completed || true

      - name: Post report issue
        run: |
          echo "post step report bytes: $(wc -c < report.md)"
          gh issue create --title "Weekly feed health report — $(date +%Y-%m-%d)" \
            --body-file report.md --label feed-health
