name: Nightly feed refresh

# Every night at 03:00 UTC: re-probe all stream URLs (iptv-org + grtv lists),
# regenerate the catalog with fresh alternates, and auto-push — so dead links
# get replaced and new mirrors get added without any manual work.
# Run it anytime from the Actions tab ("workflow_dispatch").

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feeds repo
        uses: actions/checkout@v4

      - name: Checkout channel repo (probe/generation tools)
        uses: actions/checkout@v4
        with:
          repository: kelimira/my-greek-tv
          path: channel

      - name: Use the deployed catalog as the retention baseline
        # gen_sample_feed keeps channels that the (US-based) runner cannot
        # verify, so geo-blocked streams are never silently pruned.
        run: cp channels.json channel/feed/channels.json

      - name: Fetch + probe streams
        working-directory: channel/tools
        run: python3 fetch_feeds.py

      - name: Regenerate catalog
        working-directory: channel
        run: python3 tools/gen_sample_feed.py

      - name: Validate
        run: python3 channel/tools/validate_feed.py channel/feed/channels.json

      - name: Commit and push if changed
        run: |
          cp channel/feed/channels.json channels.json
          if ! git diff --quiet channels.json; then
            git config user.name "greek-express-bot"
            git config user.email "actions@users.noreply.github.com"
            git add channels.json
            git commit -m "Nightly feed refresh: probed alternates, verified streams"
            git push
            echo "Catalog updated."
          else
            echo "No catalog changes needed."
          fi
